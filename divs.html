
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Building a List with Divs</title>

    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            background-color: red;
        }

        .flex-container > div {
            background-color: #f1f1f1;
            margin: 10px;
            padding: 20px;
            font-size: 30px;
        }

        @media (max-width: 600px) {
            .flex-container {
                flex-direction: column;
                background-color: green;
            }
        }
    </style>
</head>

<body>

    <h1>Adam Bartout builds list with divs</h1>

    <div class="flex-container" id="target">
        <div class="divlist">row item 1</div>
        <div class="divlist">row item 2</div>
        <div class="divlist">row item 3</div>
    </div>

    <p>Enter text to add a new item to the list.</p>

    <input type="text" id="inputText">

    <button onclick="makeNewDiv()">Add end</button>
    <button onclick="addFront()">Add front</button>
    <button onclick="removeEveryOther()">Remove</button>
    <button onclick="shuffle()">Shuffle</button>

    <script>
        function makeNewDiv() {
            let element = document.createElement("div");

            let value = document.getElementById("inputText").value;

            element.textContent = value;
            element.className = "divlist";

            let container = document.getElementById("target");

            container.appendChild(element);
        }

        function addFront() {
            let element = document.createElement("div");

            let value = document.getElementById("inputText").value;

            element.textContent = value;
            element.className = "divlist";

            let container = document.getElementById("target");

            container.insertBefore(element, container.firstChild);
        }

        function removeEveryOther() {
            let divListItems = document.getElementsByClassName("divlist");

            let length = divListItems.length;

            for (let i = length - 1; i >= 0; i--) {
                if (i % 2 == 0) {
                    divListItems[i].remove();
                }
            }
        }

        function shuffle() {
            let divListItems = document.getElementsByClassName("divlist");

            let length = divListItems.length;

            if (length < 2) {
                return;
            }

            let first = Math.floor(Math.random() * length);
            let second = Math.floor(Math.random() * length);

            while (first == second) {
                second = Math.floor(Math.random() * length);
            }

            let container = document.getElementById("target");

            let items = Array.from(divListItems);

            let temp = items[first];
            items[first] = items[second];
            items[second] = temp;

            container.replaceChildren(...items);
        }
    </script>

</body>
</html>
