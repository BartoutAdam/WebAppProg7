
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flower Finder Game</title>
    <meta charset="UTF-8">

    <style>
        .row {
            display: flex;
            justify-content: center;
        }

        .row div {
            margin: 3px;
        }

        .row img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Adam Bartout finds avians</h1>

    <p>Click on the locations to find the flowers, watch out for the poison ivy</p>

    <p id="locations">Number of locations checked is zero.</p>
    <p id="score">Score is zero.</p>

    <p onclick="help()" style="cursor:pointer; color:blue;">
        Click for help.
    </p>

    <p id="help">Help report</p>

    <div id="game"></div>

    <script>
        let ids = [];

        for (let i = 0; i < 36; i++) {
            ids.push("img" + i);
        }

        let score = 0;
        let locationsVisited = 0;
        let lastLocation = 0;
        let gameOver = false;

        // Generate 9 different random locations
        let randomLocations = [];

        while (randomLocations.length < 9) {
            let random = Math.floor(Math.random() * 36);

            if (!randomLocations.includes(random)) {
                randomLocations.push(random);
            }
        }

        let poisonLocation = randomLocations[0];
        let roseLocation = randomLocations[1];
        let lilyLocations = randomLocations.slice(2, 4);
        let daisyLocations = randomLocations.slice(4, 9);

        let scoredLocations = [];

        // Create the 6 by 6 game field
        let game = document.getElementById("game");

        for (let row = 0; row < 6; row++) {
            let rowDiv = document.createElement("div");
            rowDiv.className = "row";

            for (let col = 0; col < 6; col++) {
                let position = row * 6 + col;

                let box = document.createElement("div");
                let img = document.createElement("img");

                img.src = "bush.jpg";
                img.id = ids[position];
                img.alt = "Bush";

                img.onclick = function() {
                    check(position);
                };

                box.appendChild(img);
                rowDiv.appendChild(box);
            }

            game.appendChild(rowDiv);
        }

        function check(position) {
            if (gameOver) {
                return;
            }

            let image = document.getElementById(ids[position]);

            if (position == poisonLocation) {
                image.src = "ivy.jpg";
                image.alt = "Poison ivy";
                score -= 4;
                gameOver = true;
            }
            else if (position == roseLocation) {
                image.src = "rose.jpg";
                image.alt = "Rose";

                if (!scoredLocations.includes(position)) {
                    score += 4;
                    scoredLocations.push(position);
                }
            }
            else if (lilyLocations.includes(position)) {
                image.src = "lily.jpg";
                image.alt = "Lily";

                if (!scoredLocations.includes(position)) {
                    score += 2;
                    scoredLocations.push(position);
                }
            }
            else if (daisyLocations.includes(position)) {
                image.src = "daisy.jpg";
                image.alt = "Daisy";

                if (!scoredLocations.includes(position)) {
                    score += 1;
                    scoredLocations.push(position);
                }
            }
            else {
                image.onclick = null;
            }

            locationsVisited++;
            lastLocation = position;

            // Move rose after each click
            if (!gameOver) {
                moveRose(position);
            }

            document.getElementById("locations").innerHTML =
                "Number of locations checked is " + locationsVisited + ".";

            document.getElementById("score").innerHTML =
                "Score is " + score + ".";

            if (gameOver && position == poisonLocation) {
                document.getElementById("help").innerHTML =
                    "Game Over! You found poison ivy!";
            }
        }

        function moveRose(playerPosition) {
            let row = Math.floor(roseLocation / 6);
            let col = roseLocation % 6;

            let directions = [];

            if (row > 0) {
                directions.push(-6);
            }

            if (row < 5) {
                directions.push(6);
            }

            if (col > 0) {
                directions.push(-1);
            }

            if (col < 5) {
                directions.push(1);
            }

            // Choose a valid random direction
            let available = directions.filter(function(step) {
                let next = roseLocation + step;

                return next == playerPosition ||
                    (next != poisonLocation &&
                    !lilyLocations.includes(next) &&
                    !daisyLocations.includes(next));
            });

            if (available.length == 0) {
                return;
            }

            let random = Math.floor(Math.random() * available.length);
            let oldLocation = roseLocation;

            roseLocation += available[random];

            // Hide the rose at its old location
            let oldImage = document.getElementById(ids[oldLocation]);

            if (oldImage.getAttribute("src") == "rose.jpg") {
                oldImage.src = "bush.jpg";
            }

            // End game if rose lands on player
            if (roseLocation == playerPosition) {
                gameOver = true;

                document.getElementById(ids[roseLocation]).src =
                    "rose.jpg";

                document.getElementById("help").innerHTML =
                    "Game Over! The rose landed on you!";
            }
        }

        function help() {
            let row = Math.floor(lastLocation / 6);
            let col = lastLocation % 6;

            let result = "warm";

            // Check four neighbors with wrap around
            let neighbors = [
                (lastLocation + 1) % 36,
                (lastLocation + 35) % 36,
                (lastLocation + 6) % 36,
                (lastLocation + 30) % 36
            ];

            for (let location of neighbors) {
                if (daisyLocations.includes(location)) {
                    result = "cold";
                    document.getElementById("help").innerHTML = result;
                    return result;
                }
            }

            // Check nearby rose
            for (let r = row - 1; r <= row + 1; r++) {
                for (let c = col - 1; c <= col + 1; c++) {
                    if (r >= 0 && r < 6 && c >= 0 && c < 6) {
                        let location = r * 6 + c;

                        if (location == roseLocation) {
                            result = "hot";
                            document.getElementById("help").innerHTML = result;
                            return result;
                        }
                    }
                }
            }

            // Check nearby poison ivy
            for (let r = row - 1; r <= row + 1; r++) {
                for (let c = col - 1; c <= col + 1; c++) {
                    if (r >= 0 && r < 6 && c >= 0 && c < 6) {
                        let location = r * 6 + c;

                        if (location == poisonLocation) {
                            result = "watch out";
                            document.getElementById("help").innerHTML = result;
                            return result;
                        }
                    }
                }
            }

            document.getElementById("help").innerHTML = result;
            return result;
        }
    </script>
</body>
</html>
