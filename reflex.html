
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reflex Timing Game</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

    <h1>Adam Bartout reflexes</h1>

    <div id="target">Your time</div>

    <div id="countdown">Count</div>

    <br>

    <button type="button" class="btn btn-success" onclick="beginTime()">
        Go
    </button>

    <button type="button" class="btn btn-danger" onclick="recordTime()">
        Halt
    </button>

    <script>
        let haltTime = undefined;
        let running = false;

        function recordTime() {
            if (running && haltTime === undefined) {
                haltTime = Date.now();
                console.log(haltTime);
            }
        }

        function beginTime() {
            if (running) {
                return;
            }

            running = true;
            haltTime = undefined;

            document.getElementById("target").innerHTML = "Your time";

            for (let i = 0; i <= 5; i++) {
                setTimeout(function() {
                    document.getElementById("countdown").innerHTML = i;
                }, (5 - i) * 1000);
            }

            setTimeout(function() {
                if (haltTime === undefined) {
                    document.getElementById("target").innerHTML =
                        "Not soon enough";
                }
                else {
                    let targetTime = Date.now();
                    let difference = targetTime - haltTime;

                    document.getElementById("target").innerHTML =
                        "Time was " + difference + " milliseconds";
                }

                running = false;
            }, 5000);
        }
    </script>

</body>
</html>
